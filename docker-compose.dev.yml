services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: products-sqlserver-dev
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - products-network

  products-api:
    build:
      context: .
      dockerfile: src/Products.API/Dockerfile
      target: build
    container_name: products-api-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5291:8080"
    volumes:
      - ./src:/src/src:ro
      - ./Products.sln:/src/Products.sln:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - products-network
    command: ["dotnet", "watch", "run", "--project", "/src/src/Products.API/Products.API.csproj", "--no-launch-profile"]

volumes:
  sqlserver-data:
    driver: local

networks:
  products-network:
    driver: bridge
